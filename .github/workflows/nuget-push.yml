name: NuGet Publish

on:
  push:
    branches: [main]

jobs:
  test-aot:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test (JIT)
      run: dotnet test Depository.Tests/Depository.Tests.csproj -c Release --verbosity normal
    - name: Publish (AOT)
      run: dotnet publish Depository.Tests/Depository.Tests.csproj -c Release -r win-x64 -o ${{ github.workspace }}/out/aot
    - name: Run (AOT)
      run: ${{ github.workspace }}/out/aot/Depository.Tests.exe

  publish:
    needs: test-aot
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Build NuGet Packages
      run: |
        dotnet pack src/Depository/Depository.csproj -c Release -o Packages/
        dotnet pack src/Depository.Abstraction/Depository.Abstraction.csproj -c Release -o Packages/
        dotnet pack src/Depository.Core/Depository.Core.csproj -c Release -o Packages/
        dotnet pack src/Depository.Extensions/Depository.Extensions.csproj -c Release -o Packages/
        dotnet pack src/Depository.Extensions.DependencyInjection/Depository.Extensions.DependencyInjection.csproj -c Release -o Packages/
    - name: Publish Packages to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: Packages
    - name: Publish To NuGet
      run: dotnet nuget push "Packages/*.nupkg" -k ${{ secrets.NUGET_APIKEY }} -s 'https://api.nuget.org/v3/index.json' --skip-duplicate
    - name: Publish To Github Package
      run: |
        dotnet nuget add source --username kengwang --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/kengwang/index.json"
        dotnet nuget push "Packages/*.nupkg" --source "github" --skip-duplicate
